language: de-DE
key: home.about.description
value: "Wir sind eine bundesweite Initiative von Ehrenamtlichen. Wir setzen uns für klimaneutrale Städte und Gemeinden bis 2035 ein. Mit nachvollziehbaren Bewertungen und dem Austausch guter Praxis unterstützen wir Menschen, die vor Ort etwas verändern wollen."
