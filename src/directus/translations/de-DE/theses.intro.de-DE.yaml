language: de-DE
key: theses.intro
value: >-
  Wir unterstützen dich gerne bei deiner Abschlussarbeit zum kommunalen Klimaschutz.
  Hier findest du Themenvorschläge aus unserer Arbeit mit Kommunen und Lokalteams.
  Wenn dich ein Thema interessiert, schreib uns. Gemeinsam können wir die Fragestellung eingrenzen
  und besprechen, welche Daten oder Praxiserfahrungen wir beisteuern können.
