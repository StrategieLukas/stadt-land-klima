language: it-IT
key: theses.intro
value: >-
  Ci fa piacere sostenerti nella tua tesi sull’azione per il clima a livello comunale.
  Gli argomenti proposti nascono dal nostro lavoro con i comuni e i gruppi locali.
  Se un argomento ti interessa, scrivici. Possiamo definire insieme la domanda di ricerca
  e capire quali dati o esperienze sul campo possiamo condividere.
