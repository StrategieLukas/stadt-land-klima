name: Lokalteam-Einladung-Mitglieder
icon: badge
description: Die Fähigkeit, neue Mitglieder in ein Lokalteam einzuladen
enforce_tfa: false
admin_access: false
app_access: false
permissions:
  - collection: editors
    action: create
    permissions:
      _and:
        - localteam_id:
            _in:
              - $CURRENT_USER.localteams.localteam_id
    validation:
      _and:
        - localteam_id:
            _in:
              - $CURRENT_USER.localteams.localteam_id
    presets: null
    fields:
      - email
      - localteam_id
      - organisation
  - collection: editors
    action: update
    permissions:
      _and:
        - localteam_id:
            id:
              _in:
                - $CURRENT_USER.localteams.localteam_id
    validation: null
    presets: null
    fields:
      - organisation
