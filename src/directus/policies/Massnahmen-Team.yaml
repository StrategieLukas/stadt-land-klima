name: Maßnahmen-Team
icon: zoom_in
description: Nur lesender Zugriff auf Maßnahmen, Bewertungen, Kataloge und Gemeindewerte ohne personenbezogene Daten
enforce_tfa: false
admin_access: false
app_access: false
permissions:
  - collection: directus_dashboards
    action: read
    permissions:
      name:
        _eq: Maßnahmen
    validation: {}
    presets: null
    fields:
      - color
      - icon
      - id
      - name
      - note
      - panels
  - collection: directus_panels
    action: read
    permissions:
      dashboard:
        name:
          _eq: Maßnahmen
    validation: {}
    presets: null
    fields:
      - color
      - dashboard
      - height
      - icon
      - id
      - name
      - note
      - options
      - position_x
      - position_y
      - show_header
      - type
      - width
  - collection: localteams
    action: read
    permissions: null
    validation: null
    presets: null
    fields:
      - date_created
      - date_updated
      - id
      - municipality_id
      - municipality_name
      - name
      - slug
      - status
  - collection: measure_catalog
    action: read
    permissions: {}
