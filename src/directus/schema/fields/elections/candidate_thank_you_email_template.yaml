  hidden: false
  interface: input-code
  note: >-
    Vollständiges HTML-Dokument für die einmalige Dankesmail an Kandidat:innen,
    die Antworten eingereicht haben. Es gelten dieselben Platzhalter wie für die
    Einladungs-E-Mail. Eine leere oder ungültige Vorlage verhindert den Versand.
  options:
    language: html
  readonly: false
  required: false
  searchable: false
  sort: 2
