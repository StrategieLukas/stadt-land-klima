collection: elections
field: candidate_reminder_email_template
type: text
meta:
  collection: elections
  conditions: null
  display: raw
  display_options: null
  field: candidate_reminder_email_template
  group: candidate_reminder_email_settings
  hidden: false
  interface: input-code
  note: >-
    Vollständiges HTML-Dokument für den einmaligen Reminder. Es gelten dieselben
    Platzhalter wie für die Einladungs-E-Mail. Eine leere oder ungültige Vorlage
    verhindert den Versand.
  options:
    language: html
  readonly: false
  required: false
  searchable: false
  sort: 2
  special: null
  translations:
    - language: de-DE
      translation: HTML-Vorlage der Reminder-E-Mail
    - language: en-GB
