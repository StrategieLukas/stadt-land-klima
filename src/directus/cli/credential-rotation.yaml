# Operator policy: references only; NEVER put secret values in this file.
# Only legacy_frontend, candidate_links and municipality_previews are executed
# by retireCredentials.ts. All other entries are manual rotation decisions.
# review/retain skip execution; null intervals mean no periodic rotation schedule.
# Editing this file rotates nothing. Plan and apply both require --policy.
version: 1
credentials:
  legacy_frontend:
    action: revoke
    sensitivity: high
    references:
      - DIRECTUS_TOKEN
      - directus_users.token (legacy Frontend role)
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Retire the obsolete shared browser identity after deploying private
      server access. Inspect its real production permissions; do not reuse its
      token.
  candidate_links:
    action: review
    sensitivity: high
    references:
      - candidate.access_token
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Can submit election answers. Select rotate only after coordinating
      replacement invitations; review skips this family.
  municipality_previews:
    action: retain
    sensitivity: low
    references:
      - municipalities.preview_token
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Read-only preview links are low sensitivity by owner decision. Keep
      existing links; rotate only for a specific incident or deliberate
      invalidation.
  frontend_server:
    action: review
    sensitivity: high
    references:
      - DIRECTUS_FRONTEND_SERVER_TOKEN
      - NUXT_DIRECTUS_FRONTEND_SERVER_TOKEN
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Private scoped service account. Rotate the underlying Directus user token
      and update every Nuxt instance together if exposed, weak or scheduled.
  frontend_public:
    action: retain
    sensitivity: public
    references:
      - DIRECTUS_FRONTEND_PUBLIC_TOKEN
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Limited public-asset identity. Public readability must be safe regardless
      of token secrecy; remove the identity if confirmed unused.
  preview_verifier:
    action: review
    sensitivity: medium
    references:
      - DIRECTUS_PREVIEW_TOKEN
      - NUXT_DIRECTUS_PREVIEW_TOKEN
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Private verifier service credential, distinct from low-sensitivity
      municipality preview links; keep its privileges narrow.
  administrator_static_tokens:
    action: review
    sensitivity: critical
    references:
      - DIRECTUS_ADMIN_TOKEN
      - CLI_DIRECTUS_STATIC_TOKEN
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: These may reference the same Directus user token. Inventory actual
      identities, rotate each underlying credential once and update all
      aliases/consumers.
  administrator_password:
    action: review
    sensitivity: critical
    references:
      - ADMIN_PASSWORD
      - directus_users.password (administrator)
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: ADMIN_PASSWORD bootstraps a new installation. Editing the environment
      does not change an existing user password; update through authenticated
      Directus administration.
  personal_authentication:
    action: retain
    sensitivity: high
    references:
      - directus_users.password
      - directus_users.tfa_secret
      - Directus access/refresh tokens
      - Redis editor sessions
      - Data Studio browser sessions
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Per-user passwords and 2FA seeds are distinct from delegated sessions.
      Access/refresh tokens expire or refresh automatically. Reset passwords,
      re-enrol 2FA or revoke affected sessions for compromise/offboarding; avoid
      unnecessary blanket resets.
  directus_signing_secret:
    action: review
    sensitivity: critical
    references:
      - SECRET
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Coordinate JWT/session and stored encrypted-data implications against the
      pinned Directus implementation. Back up and test recovery before changing.
  legacy_instance_key:
    action: retain
    sensitivity: public
    references:
      - KEY
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Legacy instance/configuration identifier; verify actual pinned-version
      use before treating it as an authentication secret or changing it.
  captcha_secret:
    action: review
    sensitivity: high
    references:
      - ALTCHA_SECRET
      - NUXT_ALTCHA_SECRET
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Replace development/default or exposed values. Changing this also
      invalidates sessions whose independent signing keys are unset.
  editor_cookie_secret:
    action: review
    sensitivity: high
    references:
      - EDITOR_SESSION_SECRET
      - NUXT_EDITOR_SESSION_SECRET
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: If unset, derived from ALTCHA_SECRET. Changing either relevant key
      invalidates website editor cookies; sign-in is then required.
  candidate_cookie_secret:
    action: review
    sensitivity: high
    references:
      - CANDIDATE_SESSION_SECRET
      - NUXT_CANDIDATE_SESSION_SECRET
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: If unset, derived from ALTCHA_SECRET. Changing the key invalidates
      candidate sessions; existing invitation tokens remain a separate decision.
  postgres_password:
    action: review
    sensitivity: critical
    references:
      - docker/db/.env:POSTGRES_PASSWORD
      - src/directus/.env:DB_PASSWORD
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Change the real database role password, then all client secrets. Editing
      POSTGRES_PASSWORD does not rotate an existing database volume.
  meilisearch_keys:
    action: review
    sensitivity: high
    references:
      - MEILI_MASTER_KEY
      - MEILISEARCH_MASTER_KEY
      - Meilisearch API keys
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Inventory every indexer/search consumer and derived key before
      replacement; preserve data and verify allowed index/action scope.
  redis_authentication:
    action: review
    sensitivity: high
    references:
      - REDIS / REDIS_URL credentials
      - Redis ACL/password if configured
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: No password is defined in the example URL. Verify production network/ACL
      configuration; if enabling/changing auth update all Redis clients
      together.
  smtp_password:
    action: review
    sensitivity: high
    references:
      - EMAIL_SMTP_USER
      - EMAIL_SMTP_PASSWORD
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Provider-managed sending credential. Rotate with delivery verification
      and keep mail capture separate from real recipients.
  newsletter_api:
    action: review
    sensitivity: high
    references:
      - LISTMONK_API_USERNAME
      - LISTMONK_API_TOKEN
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Provider-managed access to mailing lists/subscriptions. Update Nuxt
      configuration and verify intended public lists/double opt-in.
  stadtlandzahl_authentication:
    action: review
    sensitivity: high
    references:
      - STADTLANDZAHL_BASE_HTTP_BASIC_AUTH_USER
      - STADTLANDZAHL_BASE_HTTP_BASIC_AUTH_PASSWORD
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Upstream service credential, server-only. Coordinate provider replacement
      and test authenticated datasets; not publicly verifiable.
  frontend_basic_authentication:
    action: review
    sensitivity: medium
    references:
      - FRONTEND_BASIC_AUTH_USERNAME
      - FRONTEND_BASIC_AUTH_PASSWORD
      - nginx .htpasswd if configured
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Optional staging/access gate. Verify which environment actually enables
      it before rotating or expecting protection.
  unsplash_key:
    action: review
    sensitivity: medium
    references:
      - UNSPLASH_ACCESS_KEY
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Provider-managed API/quota credential. Verify replacement via the
      authenticated server endpoint.
  carto_key:
    action: review
    sensitivity: medium
    references:
      - CARTO_BASEMAP_API_KEY
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Server-only tile-proxy credential. Coordinate provider restrictions,
      quotas and map smoke checks.
  mapbox_key:
    action: review
    sensitivity: medium
    references:
      - DIRECTUS_MAPBOX_KEY (optional)
      - Directus map-provider settings
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Optional provider credential; verify public/private key type and
      restrictions before selecting rotation.
  ai_provider_keys:
    action: review
    sensitivity: high
    references:
      - DIRECTUS_AI_*_API_KEY (if used)
      - Directus settings AI provider keys
      - ai_openai_compatible_headers
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: May include paid provider access and custom Authorization headers. Review
      settings disclosure first, then revoke exposed upstream credentials; do
      not put secret values in this file.
  temporary_account_links:
    action: retain
    sensitivity: high
    references:
      - Directus invitation/reset/verification tokens
      - Local-team activation links
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Application-managed expiry/single-use lifecycle. Invalidate affected
      links on incident; this retirement command does not manage them.
  infrastructure_credentials:
    action: review
    sensitivity: critical
    references:
      - SSH/deploy keys
      - CI/registry/DNS credentials
      - TLS private keys
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Managed outside the application configuration. Inventory with the
      host/provider operator; no SSH keys or production secret values were
      inspected here.
  flow_identifiers:
    action: retain
    sensitivity: public
    references:
      - DIRECTUS_FLOW_NOTIFY_ADMIN
      - DIRECTUS_FLOW_WELCOME_EMAIL
      - Flow UUIDs
    rotation_interval_days: null
    owner: null
    last_rotated_on: null
    next_review_on: null
    notes: Route identifiers are not authentication credentials. Keep server-side
      authorization; changing UUIDs is not a fix for vulnerable flow handling.
