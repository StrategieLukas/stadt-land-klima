name: sendWelcomeNewLocalteam
icon: email
color: null
description: Send welcome email using a fixed template through an authenticated
  administrator request from the frontend server
status: active
trigger: webhook
accountability: all
options:
  async: false
  error_on_reject: true
  method: POST
  return: null
operations:
  - name: Require Authenticated Administrator
    key: require_welcome_email_auth
    type: condition
    position_x: 1
    position_y: 1
    resolve_key: send_welcome_email_op
    options:
      filter:
        _and:
          - $accountability:
              user:
                _nnull: true
          - $accountability:
              admin:
                _eq: true
  - name: Send Welcome Email
    key: send_welcome_email_op
    type: mail
    position_x: 19
    position_y: 1
    options:
      to:
        - "{{$trigger.body.to}}"
      subject: "{{$trigger.body.subject}}"
      template: email-template-welcome-new-localteam
      data: "{{$trigger.body.data}}"
      type: template
operation_key: require_welcome_email_auth
