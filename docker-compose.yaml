services:
  db:
    # Existing PostgreSQL 13 data requires bin/upgrade_core_services.sh first.
    image: postgis/postgis:17-3.6@sha256:d7053f57b0d62c427ffbf412208b6625317124d62eebf40672e990fea81e9d53
    env_file: ./docker/db/.env
    volumes:
      - ./docker/data/db:/var/lib/postgresql/data
      - ./docker/db/health-check.sh:/bin/health-check.sh
    healthcheck:
      test: ["CMD", "health-check.sh"]
      interval: 3s
      timeout: 5s
      retries: 10

  cache:
    image: redis:8.10.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    env_file: ./docker/meilisearch/.env
    volumes:
      - ./docker/data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  directus:
    build:
      context: ./docker/directus
      args:
        - "UID=${UID:-1000}"
        - "GID=${GID:-1000}"
    env_file:
      - ./src/directus/.env
      - ./docker/meilisearch/.env
    environment:
      # Date-only election cutoffs are compared against the Berlin calendar day.
      DB_OPTIONS: "-c timezone=Europe/Berlin"
      # Published Blökkli content must not remain stale until the cache TTL expires.
      CACHE_AUTO_PURGE: "true"
      # Replaced by the security-audit hook: no query strings, headers, bodies or IPs.
      LOGGER_HTTP_AUTO_LOGGING: "false"
      LOG_STYLE: "raw"
      LOG_LEVEL: "info"
      # Pinned 11.17.4 has share-cache and resumable-upload advisories.
      # Redis remains enabled for sessions, rate limits and synchronization.
      CACHE_ENABLED: "false"
      TUS_ENABLED: "false"
      ASSETS_TRANSFORM_MAX_CONCURRENT: "${SLK_ASSET_TRANSFORM_CONCURRENCY:-8}"
    volumes:
      - ./src/directus/uploads:/directus/uploads
      - ./src/directus/dashboards/:/directus/dashboards
      - ./src/directus/extensions:/directus/extensions
      - ./src/directus/schema/:/directus/schema
      - ./src/directus/roles/:/directus/roles
      - ./src/directus/policies/:/directus/policies
      - ./src/directus/presets/:/directus/presets
      - ./src/directus/webhooks/:/directus/webhooks
      - ./src/directus/migrations/:/directus/migrations
      - ./src/directus/templates/:/directus/templates
      - ./src/directus/translations/:/directus/translations
      - ./src/directus/flows/:/directus/flows
      - ./src/directus/settings/:/directus/settings
      - ./src/directus/contents/:/directus/contents
      - ./src/directus/cli/:/directus/cli
      - ./src/directus/cli/bash-completion.sh:/home/node/.bashrc
      - ./src/directus/.env/:/directus/.env
    depends_on:
      cache:
        condition: service_healthy
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./docker/frontend
      args:
        - "UID=${UID:-1000}"
        - "GID=${GID:-1000}"
    volumes:
      - ./src/frontend:/frontend
      - ./src/directus/translations:/directus/translations:ro
    env_file:
      - ./src/frontend/.env
      - ./docker/meilisearch/.env
    networks:
      - default
    depends_on:
      - directus
