name: Dependency audit
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/package-lock.json"
      - "bin/test_suite/src/dependencyAudit.ts"
      - ".github/workflows/dependency-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      # Locked installs do not execute repository/dependency lifecycle scripts.
      - run: npm ci --ignore-scripts --prefix bin/test_suite
      - run: npm --prefix bin/test_suite run audit:dependencies -- "$RUNNER_TEMP/dependency-audit"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit
          retention-days: 14
