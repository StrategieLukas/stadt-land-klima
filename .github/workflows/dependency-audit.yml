name: Dependency audit
on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/package-lock.json"
      - "bin/test_suite/src/dependencyAudit.ts"
      - "bin/test_suite/src/lib/dependencyAuditReport.ts"
      - "bin/test_suite/src/dependencyAudit.test.ts"
      - ".github/workflows/dependency-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Locked installs do not execute repository/dependency lifecycle scripts.
      - name: Install audit tooling without lifecycle scripts
        run: npm ci --ignore-scripts --prefix bin/test_suite
      - name: Audit lockfiles and publish findings in job summary
        run: npm --prefix bin/test_suite run audit:dependencies -- "$RUNNER_TEMP/dependency-audit"
      - name: Upload audit summary and JSON reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/dependency-audit
          retention-days: 14
