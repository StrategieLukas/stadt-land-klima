name: Deployed release acceptance
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployed target for public read-only acceptance
        required: true
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
jobs:
  public-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install locked browser tooling
        run: |
          npm ci --prefix bin --ignore-scripts
          npm ci --prefix bin/test_suite --ignore-scripts
          npm --prefix bin/test_suite exec -- playwright install --with-deps chromium
      - name: Public routes, production CSP and styles
        env:
          SLK_RELEASE_TARGET: ${{ inputs.target }}
        shell: bash
        run: node bin/slk check release --target "$SLK_RELEASE_TARGET" --output full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-checks
          path: .reports/checks/
          include-hidden-files: true
          retention-days: 14
