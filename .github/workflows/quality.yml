name: Quality checks
on:
  schedule:
    - cron: "37 8 * * 1"
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install rootless container tools
        run: sudo apt-get update && sudo apt-get install -y podman uidmap crun
      - name: Install locked tools and extension dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix bin
          npm ci --prefix src/frontend
          npm ci --prefix src/directus/cli
          npm ci --prefix bin/test_suite
          npm ci --prefix podman/directus/security-patches --ignore-scripts
          for package in src/directus/extensions/*/package-lock.json; do
            npm ci --prefix "$(dirname "$package")" --ignore-scripts
          done
      - name: Strict checking, lint and formatting
        run: node bin/slk check quality --only static --output full
      - name: Fast regressions without application credentials
        run: node bin/slk check quality --only unit --output full
      - name: Build every maintained Directus extension
        run: node bin/slk check quality --only extensions --output full
      - name: Build and check pinned Directus image
        run: node bin/slk check quality --only image --output full
      - name: Verify Caddy gateway security and privacy
        run: node bin/slk check quality --only caddy --output full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-checks
          path: .reports/checks/
          include-hidden-files: true
          retention-days: 14
