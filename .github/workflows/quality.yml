name: Quality checks
on:
  schedule:
    - cron: "37 8 * * 1"
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install rootless container tools
        run: sudo apt-get update && sudo apt-get install -y podman uidmap crun
      - name: Install locked tools and extension dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix bin
          npm ci --prefix src/frontend
          npm ci --prefix src/directus/cli
          npm ci --prefix bin/test_suite
          npm ci --prefix podman/directus/security-patches --ignore-scripts
          for package in src/directus/extensions/*/package-lock.json; do
            npm ci --prefix "$(dirname "$package")" --ignore-scripts
          done
      - name: Strict checking, lint and formatting
        run: |
          npm --prefix bin run typecheck
          npm --prefix src/frontend run typecheck
          npm --prefix src/frontend run lint
          npm --prefix src/frontend run lintExtensions
          npm --prefix src/frontend run format:check
          npm --prefix src/directus/cli run typecheck
          npm --prefix bin/test_suite run typecheck
      - name: Fast regressions without application credentials
        run: npm --prefix bin/test_suite run test:unit
      - name: Build every maintained Directus extension
        shell: bash
        run: |
          set -euo pipefail
          for package in src/directus/extensions/*/package-lock.json; do
            npm --prefix "$(dirname "$package")" run build
          done
      - name: Build and check pinned Directus image
        run: |
          podman build -t localhost/slk-runtime-env:local -f podman/environment/Containerfile podman/environment
          podman build -t slk-directus-security:ci -f podman/directus/RuntimeContainerfile podman/directus
          SLK_SECURITY_IMAGE=slk-directus-security:ci npm --prefix bin/test_suite run audit:directus-image:reviewed -- "$RUNNER_TEMP/directus-image-audit"
      - name: Verify Caddy gateway security and privacy
        run: npm --prefix bin/test_suite run test:security:caddy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: directus-image-audit
          path: ${{ runner.temp }}/directus-image-audit
          retention-days: 14
