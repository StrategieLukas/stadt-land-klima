name: Native frontend compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-build:
    name: Install and build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Record the actual native platform
        run: node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})"
      - name: Install locked dependencies with optional platform bindings
        run: |
          npm ci --prefix bin --ignore-scripts
          npm ci --prefix src/frontend
      - name: Strict checking and production build
        run: node bin/slk check native --output full
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-checks-${{ matrix.os }}
          path: .reports/checks/
          include-hidden-files: true
          retention-days: 14
