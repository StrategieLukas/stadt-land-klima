name: Native frontend compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-and-build:
    name: Install and build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Record the actual native platform
        run: node -p "JSON.stringify({platform:process.platform,arch:process.arch,node:process.version})"
      - name: Install locked dependencies with optional platform bindings
        run: npm ci --prefix src/frontend
      - name: Strict checking and production build
        run: npm --prefix src/frontend run build
